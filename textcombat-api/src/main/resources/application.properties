spring.application.name=demo

# Server / Tomcat
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:textcombat1234}
server.ssl.key-alias=textcombat

spring.datasource.url=jdbc:postgresql://192.168.6.129:5432/textcombatdb
spring.datasource.username=textcombat
spring.datasource.password=textcombat
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis（戰鬥狀態）
spring.data.redis.host=${REDIS_HOST:192.168.6.129}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:textcombat}
spring.data.redis.timeout=3s

# JPA 設定
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Log 設定
# 目前作用中的檔案
logging.file.name=logs/app.log
# 滿一天就封存成 app-2026-04-18.0.log（每 10MB 或每天換檔）
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# 檔案內的 log 格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# 自己專案的 log 級別
logging.level.com.example.demo=INFO
# Hibernate 預設太吵，只在 WARN 以上才印
logging.level.org.hibernate.SQL=WARN

# JWT 設定
# secret 至少 32 字元（HS256 要求 >= 256 bits）；正式環境請改環境變數注入
jwt.secret=change-me-to-a-long-random-string-at-least-32-bytes-please
jwt.expires-hours=24
